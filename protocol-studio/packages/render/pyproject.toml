[project]
name = "ps-render"
version = "0.1.0"
description = "Protocol Studio renderer: model + blocks -> Render AST -> LaTeX (Tectonic) / DOCX."
requires-python = ">=3.12"
dependencies = ["ps-model", "python-docx>=1.1"]

[tool.uv.sources]
ps-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps_render"]
