[project]
name = "ps-rules"
version = "0.1.0"
description = "Protocol Studio validation rules (R01–R22 catalogue) producing typed findings."
requires-python = ">=3.12"
dependencies = ["ps-model"]

[tool.uv.sources]
ps-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps_rules"]
