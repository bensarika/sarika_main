[project]
name = "ps-model"
version = "0.1.0"
description = "Protocol Studio trial model: schema validation, canonical outline, required-slot map, completion."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps_model"]
