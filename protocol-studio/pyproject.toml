[project]
name = "protocol-studio-workspace"
version = "0.1.0"
description = "Protocol Studio monorepo root (uv workspace). Real code lives in apps/* and packages/*."
requires-python = ">=3.12"
dependencies = [
    "protocol-studio-api",
    "ps-model",
    "ps-rules",
    "ps-render",
    "ps-stats",
]

[tool.uv.workspace]
members = ["apps/api", "packages/model", "packages/rules", "packages/render", "packages/stats"]

[tool.uv.sources]
protocol-studio-api = { workspace = true }
ps-model = { workspace = true }
ps-rules = { workspace = true }
ps-render = { workspace = true }
ps-stats = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
    "types-openpyxl",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["apps/api", "packages/model/src", "packages/rules/src", "packages/render/src", "packages/stats/src"]
extend-exclude = ["mock", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# E501: `ruff format` owns line length. RUF001/2: typographic quotes/arrows in user-facing strings are intended.
ignore = ["RUF012", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` in defaults is the framework idiom.
"apps/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ps_model", "ps_rules", "ps_render", "ps_stats", "protocol_studio"]
mypy_path = "packages/model/src:packages/rules/src:packages/render/src:packages/stats/src:apps/api"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/model/tests", "packages/rules/tests", "packages/render/tests", "packages/stats/tests"]
addopts = "-q"
