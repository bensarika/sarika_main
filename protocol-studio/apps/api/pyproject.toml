[project]
name = "protocol-studio-api"
version = "0.1.0"
description = "Protocol Studio API: works, edit/commit engine, versions, findings, export, auth, admin."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "authlib>=1.3",
    "httpx>=0.27",
    "boto3>=1.34",
    "ps-model",
    "ps-rules",
    "ps-render",
    "ps-stats",
]

[tool.uv.sources]
ps-model = { workspace = true }
ps-rules = { workspace = true }
ps-render = { workspace = true }
ps-stats = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["protocol_studio"]
