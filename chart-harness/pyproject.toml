[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-harness"
version = "0.2.0"
description = "Bounded model-assisted graphical measurement with pixel provenance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "Pillow>=10.1,<13", "PyMuPDF>=1.24,<2"]

[project.scripts]
chart-harness = "chart_harness.cli:main"

[tool.setuptools.packages.find]
include = ["chart_harness*"]
