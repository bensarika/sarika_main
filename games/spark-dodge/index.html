<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SARIKA PONG</title>
<link rel="icon" href="data:," />
<style>
  :root {
    color-scheme: dark;
    --maroon: #3e0606;
    --maroon-deep: #240303;
    --maroon-light: #5c1414;
    --cream: #f7edea;
    --igg: #f2c14e;
    --igg-alt: #7fc8b0;
    --denatured: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px 0;
    background: radial-gradient(circle at 50% 12%, #5a0d0d, var(--maroon-deep) 72%);
    color: var(--cream);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { display: flex; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: 3px; font-weight: 600; }
  #logo { width: 38px; height: 38px; flex: none; }
  #hud {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 24px;
    max-width: 96vw;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    opacity: .85;
  }
  #who { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; display: inline-block; }
  canvas {
    background: #1c0303;
    border: 1px solid var(--maroon-light);
    border-radius: 12px;
    touch-action: none;
    max-width: 96vw;
    height: auto;
  }
  #hint { font-size: 13px; opacity: .6; max-width: 96vw; text-align: center; }
  #name {
    background: #1c0303;
    border: 1px solid var(--maroon-light);
    border-radius: 8px;
    color: inherit;
    font: inherit;
    font-size: 15px;
    padding: 6px 10px;
    width: 220px;
    max-width: 60vw;
  }
  #name:focus { outline: none; border-color: var(--igg); }
</style>
</head>
<body>
  <header>
    <svg id="logo" viewBox="-50 -50 100 100" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true">
      <g id="petals">
        <ellipse cx="0" cy="-24" rx="10" ry="24" />
        <ellipse cx="0" cy="-24" rx="10" ry="24" transform="rotate(60)" />
        <ellipse cx="0" cy="-24" rx="10" ry="24" transform="rotate(120)" />
        <ellipse cx="0" cy="-24" rx="10" ry="24" transform="rotate(180)" />
        <ellipse cx="0" cy="-24" rx="10" ry="24" transform="rotate(240)" />
        <ellipse cx="0" cy="-24" rx="10" ry="24" transform="rotate(300)" />
      </g>
    </svg>
    <h1>SARIKA PONG</h1>
  </header>
  <input id="name" type="text" maxlength="16" placeholder="Enter your name" autocomplete="off" />
  <div id="hud"><span>Player: <b id="who">Guest</b></span><span>Caught: <b id="score">0</b></span><span>Best: <b id="best">0</b></span><span>Antigen-bound: <b id="bound">10%</b></span></div>
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hint">Move the FcRn receptor with the mouse, touch, or arrow keys. Catch as many free IgG antibodies as you can — catching one with a red antigen bound in its arms ends the run, and antigen-bound antibodies get more common the longer you last.</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const nameEl = document.getElementById('name');
const whoEl = document.getElementById('who');
const boundEl = document.getElementById('bound');

const CREAM = '#f7edea';
const MEMBRANE_TOP = H - 74;
const IGG_COLORS = ['#f2c14e', '#7fc8b0'];
const ANTIGEN = '#e05a5a';

let best = Number(localStorage.getItem('sarikaPongCaught') || 0);
bestEl.textContent = best;

let playerName = localStorage.getItem('sparkPongName') || '';
nameEl.value = playerName;
whoEl.textContent = playerName || 'Guest';
nameEl.addEventListener('input', () => {
  playerName = nameEl.value.trim();
  whoEl.textContent = playerName || 'Guest';
  localStorage.setItem('sparkPongName', playerName);
});
nameEl.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') nameEl.blur();
});

// The receptor is a cradle between two poles anchored in the membrane.
// `r` is the cradle half-width; the stroke adds half a line width on each side.
const player = { x: W / 2, y: MEMBRANE_TOP - 46, r: 26, vx: 0 };
const EDGE = 32;
const clampX = x => Math.max(EDGE, Math.min(W - EDGE, x));
let antibodies = [], score = 0, tick = 0, over = false;
const keys = new Set();

// Share of spawns carrying a bound antigen; ramps with time survived.
function boundChance() {
  return Math.min(0.75, 0.1 + tick * 0.00012);
}

function reset() {
  antibodies = []; score = 0; tick = 0; over = false;
  player.x = W / 2; player.vx = 0;
  scoreEl.textContent = score;
}

const typing = () => document.activeElement === nameEl;

addEventListener('keydown', e => {
  if (typing()) return;
  keys.add(e.key);
  if (over && (e.key === ' ' || e.key === 'Enter')) reset();
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key));

function pointerTo(clientX) {
  if (over) return;
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  player.x = clampX(x);
}
canvas.addEventListener('mousemove', e => pointerTo(e.clientX));
canvas.addEventListener('touchmove', e => { pointerTo(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
canvas.addEventListener('click', () => { if (over) reset(); });

function antibody() {
  return {
    x: 24 + Math.random() * (W - 48),
    y: -28,
    r: 19,
    vy: 2 + Math.random() * 1.6,
    rot: (Math.random() - 0.5) * 0.6,
    vr: (Math.random() - 0.5) * 0.04,
    color: IGG_COLORS[Math.floor(Math.random() * IGG_COLORS.length)],
    bound: Math.random() < boundChance()
  };
}

function spawn() {
  if (tick % 24 === 0) antibodies.push(antibody());
}

// Caught when the antibody overlaps the receptor cradle.
function caught(a) {
  const dx = Math.abs(a.x - player.x), dy = Math.abs(a.y - player.y);
  return dx < player.r && dy < 20;
}

function update() {
  tick++;
  if (keys.has('ArrowLeft')) player.vx -= 0.8;
  if (keys.has('ArrowRight')) player.vx += 0.8;
  player.vx *= 0.86;
  player.x = clampX(player.x + player.vx);

  spawn();
  for (const a of antibodies) { a.y += a.vy; a.rot += a.vr; }
  antibodies = antibodies.filter(a => a.y < H + 30);

  let exposed = false;
  antibodies = antibodies.filter(a => {
    if (!caught(a)) return true;
    if (a.bound) { exposed = true; return true; }
    score++;
    return false;
  });
  scoreEl.textContent = score;
  boundEl.textContent = Math.round(boundChance() * 100) + '%';

  if (exposed) {
    over = true;
    if (score > best) { best = score; localStorage.setItem('sarikaPongCaught', String(best)); bestEl.textContent = best; }
  }
}

function drawAntibody(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.scale(a.r / 19, a.r / 19);
  ctx.strokeStyle = a.color;
  ctx.lineWidth = 4.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  // Heavy chains: V arms meeting the split stem.
  ctx.moveTo(-14, -18); ctx.lineTo(-4, -8); ctx.lineTo(-4, 18);
  ctx.moveTo(14, -18); ctx.lineTo(4, -8); ctx.lineTo(4, 18);
  // Hinge bar between the two stem strands.
  ctx.moveTo(-4, -2); ctx.lineTo(4, -2);
  // Light chains: outer prongs parallel to each arm.
  ctx.moveTo(-19, -13); ctx.lineTo(-10, -4);
  ctx.moveTo(19, -13); ctx.lineTo(10, -4);
  ctx.stroke();

  if (a.bound) drawAntigen();
  ctx.restore();
}

// Antigen wedged in the antibody's binding cleft, between the Fab arms.
function drawAntigen() {
  ctx.fillStyle = ANTIGEN;
  ctx.strokeStyle = ANTIGEN;
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const t = Math.PI / 6 + i * Math.PI / 3;
    const px = Math.cos(t) * 7, py = -13 + Math.sin(t) * 7;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  // Contacts to both Fab arms.
  ctx.beginPath();
  ctx.moveTo(-6, -16); ctx.lineTo(-11, -19);
  ctx.moveTo(6, -16); ctx.lineTo(11, -19);
  ctx.stroke();
}

function drawMembrane() {
  const grad = ctx.createLinearGradient(0, MEMBRANE_TOP, 0, H);
  grad.addColorStop(0, '#5c1414');
  grad.addColorStop(1, '#3e0606');
  ctx.fillStyle = grad;
  ctx.fillRect(0, MEMBRANE_TOP, W, H - MEMBRANE_TOP);

  // Phospholipid bilayer: two rows of heads with tails facing inward.
  ctx.strokeStyle = 'rgba(247,237,234,0.28)';
  ctx.lineWidth = 2;
  for (let x = 10; x < W; x += 20) {
    for (const [headY, dir] of [[MEMBRANE_TOP + 9, 1], [H - 9, -1]]) {
      ctx.beginPath();
      ctx.arc(x, headY, 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, headY + 5 * dir);
      ctx.lineTo(x, headY + 20 * dir);
      ctx.stroke();
    }
  }
}

function drawReceptor() {
  const x = player.x, top = player.y;
  ctx.strokeStyle = CREAM;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Two transmembrane poles anchored through the bilayer.
  ctx.beginPath();
  ctx.moveTo(x - 14, top + 10); ctx.lineTo(x - 14, H - 14);
  ctx.moveTo(x + 14, top + 10); ctx.lineTo(x + 14, H - 14);
  ctx.stroke();

  // Binding cradle that catches the antibodies.
  ctx.strokeStyle = '#f2c14e';
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(x - 26, top - 12);
  ctx.quadraticCurveTo(x, top + 18, x + 26, top - 12);
  ctx.stroke();

  // Below the cradle so a caught antibody never covers it, and inset so it
  // stays readable at either edge.
  ctx.fillStyle = 'rgba(247,237,234,0.8)';
  ctx.font = '600 11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('FcRn receptor', Math.max(42, Math.min(W - 42, x)), top + 36);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawMembrane();
  drawReceptor();
  for (const a of antibodies) drawAntibody(a);

  if (over) {
    ctx.fillStyle = 'rgba(36,3,3,0.85)';
    ctx.fillRect(0, H / 2 - 70, W, 140);
    ctx.fillStyle = CREAM;
    ctx.textAlign = 'center';
    ctx.font = '600 30px system-ui, sans-serif';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 14);
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText((playerName || 'Guest') + '  ·  Caught ' + score + '  ·  Best ' + best, W / 2, H / 2 + 16);
    ctx.fillText('Click or press Space to play again', W / 2, H / 2 + 46);
  }
}

function loop() {
  if (!over) update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
